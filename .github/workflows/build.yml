name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download real Gradle wrapper jar
        run: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew

      - name: Download Clash Meta AAR
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/clash-meta.aar \
            "https://github.com/MetaCubeX/ClashMetaForAndroid/releases/download/v2.10.1-Alpha/app-release.aar" \
            || curl -L -o app/libs/clash-meta.aar \
            "https://github.com/MetaCubeX/ClashMetaForAndroid/releases/latest/download/app-release.aar"
          ls -lh app/libs/

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNApp
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
