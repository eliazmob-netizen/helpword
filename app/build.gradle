plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vpnapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.vpnapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/INDEX.LIST']
        }
        jniLibs {
            // Keep all .so files from clash-android AAR
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // HTTP client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // YAML parsing
    implementation 'org.yaml:snakeyaml:2.2'

    // clash-android — Go-based Clash core compiled for Android
    // Provides: ClashLib.so with full SS/VMess/VLESS/Trojan support
    // Source: https://github.com/MetaCubeX/ClashMetaForAndroid
    implementation 'com.github.MetaCubeX:ClashMetaForAndroid:v2.10.1-Alpha-release'
}
